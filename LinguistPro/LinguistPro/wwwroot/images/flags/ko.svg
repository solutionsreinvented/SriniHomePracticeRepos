<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600">
  <!-- White background -->
  <rect width="900" height="600" fill="#FFFFFF"/>

  <!-- Red upper semicircle -->
  <circle cx="450" cy="300" r="180" fill="#C60C30"/>

  <!-- Blue lower semicircle (yin-yang style) -->
  <path d="M 270 300 A 180 180 0 0 1 630 300 A 180 180 0 0 1 270 300 Z" fill="#003478"/>

  <!-- Red small circle in blue section -->
  <circle cx="450" cy="390" r="60" fill="#C60C30"/>

  <!-- Blue small circle in red section -->
  <circle cx="450" cy="210" r="60" fill="#003478"/>
</svg>