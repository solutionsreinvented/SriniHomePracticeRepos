<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="FeaWeb — Professional web-based Structural Analysis and Design software. 3D FEA solver with RFEM-inspired UI." />
  <title>FeaWeb — Structural Analysis Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
</head>
<body>
  <div id="app">

    <!-- ══ Title Bar ══════════════════════════════════════ -->
    <div id="title-bar">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <polygon points="12,2 22,20 2,20" fill="rgba(79,158,255,.2)" stroke="#4f9eff"/>
          <line x1="12" y1="2" x2="12" y2="20" stroke="#4f9eff"/>
          <line x1="2" y1="20" x2="22" y2="20"/>
          <line x1="7" y1="11" x2="17" y2="11"/>
        </svg>
        <span>Fea<span class="brand">Web</span></span>
      </div>

      <nav class="menu-bar">
        <button id="menu-new"   title="New Model">File</button>
        <button id="menu-edit"  title="Edit">Edit</button>
        <button id="menu-view"  title="View">View</button>
        <button id="menu-tools" title="Tools">Tools</button>
        <button id="menu-help"  title="Help">Help</button>
      </nav>

      <div class="title-center" id="title-filename">Untitled Model.fea</div>

      <div class="window-controls">
        <button class="btn-min"   title="Minimize"></button>
        <button class="btn-max"   title="Maximize"></button>
        <button class="btn-close" title="Close"></button>
      </div>
    </div>

    <!-- ══ Ribbon ═════════════════════════════════════════ -->
    <div id="ribbon"></div>

    <!-- ══ Main Workspace ════════════════════════════════ -->
    <div id="main-area">

      <!-- Left: Model Tree -->
      <div id="model-tree-panel" class="side-panel">
        <div class="panel-header">
          <h3>Model Navigator</h3>
          <button class="panel-icon-btn" title="Collapse all">
            <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" width="14" height="14">
              <polyline points="2,5 7,10 12,5"/>
            </svg>
          </button>
        </div>
        <div class="tree-search">
          <svg class="tree-search-icon" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4">
            <circle cx="6" cy="6" r="4"/><line x1="9.5" y1="9.5" x2="13" y2="13"/>
          </svg>
          <input type="text" placeholder="Filter…" id="tree-filter" />
        </div>
        <div id="model-tree-scroll"></div>
      </div>

      <!-- Centre: 3D Viewport -->
      <div id="viewport-container">
        <canvas id="viewport-canvas"></canvas>

        <!-- Viewport overlay toolbar (view controls) -->
        <div id="viewport-toolbar" style="
          position:absolute; top:10px; right:10px;
          display:flex; flex-direction:column; gap:4px; z-index:10;">
          <button class="vp-btn" id="vpbtn-iso"   title="Isometric View (Home)"
            style="background:rgba(30,33,40,.85);border:1px solid #2d3240;color:#8b95aa;
                   width:34px;height:34px;border-radius:5px;display:flex;align-items:center;
                   justify-content:center;cursor:pointer;transition:all .15s">
            <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4" width="18" height="18">
              <path d="M9 2l7 4v8l-7 4-7-4V6z"/>
            </svg>
          </button>
          <button class="vp-btn" id="vpbtn-fit"   title="Fit All (F)"
            style="background:rgba(30,33,40,.85);border:1px solid #2d3240;color:#8b95aa;
                   width:34px;height:34px;border-radius:5px;display:flex;align-items:center;
                   justify-content:center;cursor:pointer;transition:all .15s">
            <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4" width="18" height="18">
              <path d="M11 2h5v5M7 16H2v-5M16 11v5h-5M2 7V2h5"/>
            </svg>
          </button>
          <button class="vp-btn" id="vpbtn-front" title="Front View"
            style="background:rgba(30,33,40,.85);border:1px solid #2d3240;color:#8b95aa;
                   width:34px;height:34px;border-radius:5px;display:flex;align-items:center;
                   justify-content:center;cursor:pointer;transition:all .15s;font-size:10px;font-weight:600;">
            XZ
          </button>
          <button class="vp-btn" id="vpbtn-top"   title="Top View"
            style="background:rgba(30,33,40,.85);border:1px solid #2d3240;color:#8b95aa;
                   width:34px;height:34px;border-radius:5px;display:flex;align-items:center;
                   justify-content:center;cursor:pointer;transition:all .15s;font-size:10px;font-weight:600;">
            XY
          </button>
        </div>

        <!-- Snap indicator -->
        <div id="snap-indicator" style="
          position:absolute; bottom:8px; left:108px;
          font-family:var(--font-mono,monospace); font-size:11px;
          color:#facc15; background:rgba(15,17,23,.7);
          padding:2px 8px; border-radius:3px; pointer-events:none; display:none;">
          ⊕ SNAP
        </div>
      </div>

      <!-- Right: Properties -->
      <div id="properties-panel" class="side-panel">
        <div class="panel-header">
          <h3>Properties</h3>
        </div>
        <div id="properties-scroll"></div>
      </div>

    </div><!-- /main-area -->

    <!-- ══ Status Bar ════════════════════════════════════ -->
    <div id="status-bar">
      <div class="status-seg" id="status-coords">
        <label>X</label><span id="sb-x">   0.000</span>
        <label>Y</label><span id="sb-y">   0.000</span>
        <label>Z</label><span id="sb-z">   0.000</span>
      </div>
      <div class="status-divider"></div>
      <div class="status-seg">
        <label>Tool</label>
        <span id="status-tool-name">Select</span>
      </div>
      <div class="status-divider"></div>
      <div class="status-seg">
        <span id="sb-status" style="color:var(--text-muted)">Ready</span>
      </div>
      <div class="status-right">
        <div class="status-seg">
          <label>Nodes</label><span id="sb-nodes">0</span>
        </div>
        <div class="status-seg">
          <label>Members</label><span id="sb-elems">0</span>
        </div>
        <div class="status-seg" style="color:var(--text-muted)">FeaWeb v1.0</div>
      </div>
    </div>

  </div><!-- /app -->

  <!-- Toast container -->
  <div id="toast-container" class="toast-container"></div>

  <script type="module" src="/src/main.js"></script>

  <style>
    /* Inline critical viewport overflow fix */
    #main-area { overflow: hidden; flex: 1; display: flex; }
    #viewport-container { flex: 1; position: relative; overflow: hidden; }
    #viewport-canvas { width: 100%; height: 100%; display: block; }
    .vp-btn:hover { background: rgba(50,55,70,.95) !important; color: #e8ecf4 !important; }
  </style>
</body>
</html>
